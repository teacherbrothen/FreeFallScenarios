        }

        }

<div class="quiz-card" id="quiz-card">
    <h2>1D Free Fall: Kinematics & Concepts</h2>
    
    <div class="score-row">
        <span class="correct">Correct: <span id="correct-count">0</span> / 10 Target</span>
        <span class="incorrect">Incorrect: <span id="incorrect-count">0</span></span>

    <div class="graphic-container" id="display-card">
        <span class="id-badge">ID: <span id="sim-id">---------</span></span>
        <div class="diagram-wrapper" id="svg-diagram"></div>
        <div id="statement-display" class="statement-text">Loading problem...</div>
    </div>

    <div id="instruction" class="instruction-banner">Select the best answer.</div>

    <div id="feedback" class="feedback-banner"></div>

    <div class="button-row" id="action-buttons">
        <button class="btn-choice" id="opt-btn-0" onclick="submitAnswer(0)">Option 1</button>
        <button class="btn-choice" id="opt-btn-1" onclick="submitAnswer(1)">Option 2</button>
        <button class="btn-choice" id="opt-btn-2" onclick="submitAnswer(2)">Option 3</button>
    </div>
    
    <div class="button-row" style="margin-top: 12px;">
        <button id="next-btn" class="btn-next" onclick="loadNextStatement()">Next Question ➔</button>
    </div>

    <div class="progress-text" id="progress-display">
        Target: Answer 10 correctly to finish
    </div>

    <!-- Always-Visible Copy Proof Button Section -->

        <span class="copy-hint">Click anytime to capture your card verification proof to paste (Ctrl+V) into Brightspace.</span>
    </div>
</div>

<script>

    // Bank of 35 targeted questions categorized across 8 distinct topics
    const questionBank = [
        // --- TOPIC: apex ---
        {
            topic: "apex",
            text: "A tennis ball is hit straight up into the air. At its highest point (the apex), what is its instantaneous acceleration $\\vec{a}$?",
            diagram: "apex_zoom",
            options: [
                { text: "$\\vec{a} = -9.81\\text{ m/s}^2$", correct: true, trap: "" },
                { text: "$\\vec{a} = 0\\text{ m/s}^2$", correct: false, trap: "Common Trap! Velocity is zero at the apex, but acceleration is not. If acceleration were zero, the ball would remain suspended in mid-air!" },

            text: "A ball is thrown straight up from Point A. At the very top of its trajectory (Point B), what is its instantaneous velocity $\\vec{v}$?",
            diagram: "toss_apex",
            options: [
                { text: "$\\vec{v} = 0\\text{ m/s}$", correct: true, trap: "" },

    let shuffledQuestions = [];
    let currentIndex = 0;
    let correctTotal = 0;
    let incorrectTotal = 0;
    const TARGET_CORRECT = 10;
    let currentShuffledOptions = [];

    function generateId() {
        const now = new Date();
        const yearDigit = String(now.getFullYear()).slice(-1);
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const randomDigits = String(Math.floor(1000 + Math.random() * 9000));
        return `${yearDigit}${month}${day}${randomDigits}`;
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Intelligent shuffle to prevent concept clumping
    function smartShuffleQuestions(bank) {
        const topics = {};
        bank.forEach(q => {
            if (!topics[q.topic]) topics[q.topic] = [];
            topics[q.topic].push(q);
        });

        Object.keys(topics).forEach(t => {
            topics[t] = shuffleArray(topics[t]);
        });

        const topicKeys = Object.keys(topics);
        const result = [];
        let lastTopic = null;
        let remaining = bank.length;

        while (remaining > 0) {
            const availableTopics = shuffleArray(topicKeys.filter(t => topics[t].length > 0));
            let pickedInCycle = false;

            for (const t of availableTopics) {
                if (t !== lastTopic && topics[t].length > 0) {
                    result.push(topics[t].pop());
                    lastTopic = t;
                    remaining--;
                    pickedInCycle = true;
                    break;
                }
            }

            if (!pickedInCycle) {
                for (const t of availableTopics) {
                    if (topics[t].length > 0) {
                        result.push(topics[t].pop());
                        lastTopic = t;
                        remaining--;
                        break;
                    }
                }
            }
        }
        return result;
    }

    function initQuiz() {
        // Rebuild container structure cleanly
        const card = document.getElementById("display-card");
        card.innerHTML = `
            <span class="id-badge">ID: <span id="sim-id">${generateId()}</span></span>
            <div class="diagram-wrapper" id="svg-diagram"></div>
            <div id="statement-display" class="statement-text">Loading problem...</div>
        `;

        shuffledQuestions = smartShuffleQuestions(questionBank);
        currentIndex = 0;
        correctTotal = 0;
        incorrectTotal = 0;
        document.getElementById("correct-count").innerText = "0";
        document.getElementById("incorrect-count").innerText = "0";
        
        const nextBtn = document.getElementById("next-btn");
        nextBtn.onclick = loadNextStatement;

        document.getElementById("instruction").style.display = "block";
        document.getElementById("progress-display").style.display = "block";
        displayCurrentStatement();
    }

    function displayCurrentStatement() {
        const q = shuffledQuestions[currentIndex];
        
        // Render SVG Diagram
        document.getElementById("svg-diagram").innerHTML = diagrams[q.diagram] || "";
        document.getElementById("statement-display").innerText = q.text;

        // Shuffle options for current question
        currentShuffledOptions = shuffleArray(q.options);

        // Populate the 3 buttons
        for (let i = 0; i < 3; i++) {
            const btn = document.getElementById(`opt-btn-${i}`);
            btn.innerHTML = currentShuffledOptions[i].text;
            btn.style.display = "inline-block";
        }

        document.getElementById("feedback").style.display = "none";
        document.getElementById("instruction").style.display = "block";
        document.getElementById("action-buttons").style.display = "flex";
        document.getElementById("next-btn").style.display = "none";

        renderMath();
    }

    function submitAnswer(chosenIndex) {
        const q = shuffledQuestions[currentIndex];
        const chosen = currentShuffledOptions[chosenIndex];
        const feedbackEl = document.getElementById("feedback");
        const instructionEl = document.getElementById("instruction");
        const actionBtns = document.getElementById("action-buttons");
        const nextBtn = document.getElementById("next-btn");

        instructionEl.style.display = "none";
        actionBtns.style.display = "none";

        if (chosen.correct) {
            correctTotal++;
            document.getElementById("correct-count").innerText = correctTotal;
            feedbackEl.className = "feedback-banner fb-correct";
            feedbackEl.innerHTML = `<strong>Correct!</strong><br>${q.explanation}`;
        } else {
            incorrectTotal++;
            document.getElementById("incorrect-count").innerText = incorrectTotal;
            feedbackEl.className = "feedback-banner fb-incorrect";
            feedbackEl.innerHTML = `<strong>Incorrect.</strong><br>${chosen.trap ? `<strong>Misconception Alert:</strong> ${chosen.trap}<br><br>` : ""}<strong>Correct Concept:</strong> ${q.explanation}`;
        }

        feedbackEl.style.display = "block";

        if (correctTotal >= TARGET_CORRECT) {
            nextBtn.innerText = "View Final Mastery Proof 🏆";
        } else {
            nextBtn.innerText = "Next Question ➔";
        }
        nextBtn.style.display = "block";

        renderMath();
    }

    function loadNextStatement() {
        if (correctTotal >= TARGET_CORRECT) {
            showCompletionScreen();
            return;
        }

        currentIndex++;
        if (currentIndex >= shuffledQuestions.length) {
            shuffledQuestions = smartShuffleQuestions(questionBank);
            currentIndex = 0;
        }
        displayCurrentStatement();
    }

    function showCompletionScreen() {
        document.getElementById("instruction").style.display = "none";
        document.getElementById("feedback").style.display = "none";
        document.getElementById("action-buttons").style.display = "none";
        document.getElementById("progress-display").style.display = "none";
        
        const card = document.getElementById("display-card");
        card.innerHTML = `
            <span class="id-badge">ID: <span id="sim-id">${generateId()}</span></span>
            <div class="completion-box">
                <div class="completion-title">🎉 Free Fall Mastery Achieved!</div>
                <p>You have mastered 1D free fall concepts, vector signs, and kinematic scenarios.</p>
                <div style="font-size: 1.15em; margin: 16px 0;">
                    <div>Target Score: <strong>10 Correct</strong></div>
                    <div>Total Attempts: <strong>${correctTotal + incorrectTotal}</strong></div>
                    <div>Accuracy: <strong>${Math.round((correctTotal / (correctTotal + incorrectTotal)) * 100)}%</strong></div>
                </div>
                <p style="color: #64748b; font-size: 0.9em;">Click the button below to copy proof for submission.</p>
            </div>
        `;

        const nextBtn = document.getElementById("next-btn");
        nextBtn.innerText = "Practice Again 🔄";
        nextBtn.style.display = "block";
        nextBtn.onclick = function() {
            initQuiz();
        };
    }

    async function copyProofToClipboard() {
        const copyBtn = document.getElementById('copy-btn');
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "⏳ Capturing proof...";
        copyBtn.disabled = true;

        try {
            const simElement = document.getElementById('quiz-card');
            const canvas = await html2canvas(simElement, {
                backgroundColor: "#ffffff",
                scale: 2
            });
            
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert("Could not generate image. Please try again.");
                    copyBtn.innerText = originalText;
                    copyBtn.disabled = false;
                    return;
                }

                try {
                    await navigator.clipboard.write([
                        new ClipboardItem({ 'image/png': blob })
                    ]);
                    copyBtn.innerText = "✅ Proof Copied to Clipboard!";
                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                        copyBtn.disabled = false;
                    }, 2500);
                } catch (err) {
                    console.error('Clipboard write error:', err);
                    alert('Clipboard write blocked by browser permissions. Take a screenshot (Win+Shift+S or Cmd+Shift+4).');
                    copyBtn.innerText = originalText;
                    copyBtn.disabled = false;
                }
            }, 'image/png');
        } catch (error) {
            console.error('html2canvas capture error:', error);
            alert('Failed to capture proof.');
            copyBtn.innerText = originalText;
            copyBtn.disabled = false;
        }
    }

    window.onload = function() {
        initQuiz();
    };
</script>

</body>
</html>
